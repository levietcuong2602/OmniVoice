services:
  omnivoice:
    build:
      context: .
      dockerfile: Dockerfile
    image: omnivoice:cpu
    ports:
      - "${PORT:-7860}:7860"
    volumes:
      - hf-cache:/cache/huggingface
    environment:
      - HF_HOME=/cache/huggingface
      - TRANSFORMERS_CACHE=/cache/huggingface/hub
      # - HF_TOKEN=${HF_TOKEN}
    command:
      - "--model"
      - "${OMNIVOICE_MODEL:-k2-fsa/OmniVoice}"
      - "--port"
      - "7860"
      - "--ip"
      - "0.0.0.0"
      - "--no-asr"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  hf-cache:
