services:
  omnivoice:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: omnivoice:gpu
    ports:
      - "${PORT:-7860}:7860"
    volumes:
      - hf-cache:/cache/huggingface
    environment:
      - HF_HOME=/cache/huggingface
      - TRANSFORMERS_CACHE=/cache/huggingface/hub
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Uncomment if model requires HF authentication
      # - HF_TOKEN=${HF_TOKEN}
    command:
      - "--model"
      - "${OMNIVOICE_MODEL:-k2-fsa/OmniVoice}"
      - "--port"
      - "7860"
      - "--ip"
      - "0.0.0.0"
      - "--device"
      - "cuda"
      - "--asr-model"
      - "${ASR_MODEL:-openai/whisper-large-v3-turbo}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  hf-cache:
